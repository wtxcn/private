<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Card Offers</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section class="access" id="access">
    <div>
      <h2>Enter access key</h2>
      <p>The key is stored only on this device.</p>
    </div>
    <form id="access-form">
      <input id="access-key" type="password" autocomplete="current-password" placeholder="Access key" required>
      <button type="submit">Open dashboard</button>
    </form>
    <p class="error" id="access-error" role="alert"></p>
  </section>

  <div class="dashboard" id="dashboard" hidden>
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">CO</div>
      <div class="brand-copy">
        <h1>Card Offers Dashboard</h1>
        <p>Private local view by bank and card</p>
      </div>
      <div class="updated" id="updated">Not connected</div>
      <button class="icon-button" id="refresh" type="button" title="Refresh" aria-label="Refresh">↻</button>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2 class="side-title">Banks</h2>
        <div class="filter-list" id="bank-filters" aria-label="Bank filter"></div>
        <h2 class="side-title">Status</h2>
        <div class="filter-list" id="status-filters" aria-label="Status filter"></div>
        <p class="privacy">Offer data stays on this Mac. Bank logins, cookies and full card numbers are not stored.</p>
      </aside>

      <section class="content">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search merchant, bank or offer...">
        </label>
        <div class="stats" id="stats"></div>
        <div class="results" id="results"></div>
        <div class="empty" id="empty" hidden>No matching offers.</div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
