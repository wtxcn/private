<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Card Offers</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">CO</div>
    <div class="brand-copy">
      <h1>Card Offers</h1>
      <p>Private VPN dashboard</p>
    </div>
    <div class="updated" id="updated">Not connected</div>
    <button class="icon-button" id="refresh" type="button" title="Refresh" aria-label="Refresh">↻</button>
  </header>

  <main>
    <section class="access" id="access">
      <div>
        <h2>Enter access key</h2>
        <p>The key is stored only on this device.</p>
      </div>
      <form id="access-form">
        <input id="access-key" type="password" autocomplete="current-password" placeholder="Access key" required>
        <button type="submit">Open dashboard</button>
      </form>
      <p class="error" id="access-error" role="alert"></p>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <div class="controls">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search CVS, Lyft, dining, card...">
        </label>
        <div class="filters" id="bank-filters" aria-label="Bank filter"></div>
        <div class="filters" id="status-filters" aria-label="Status filter"></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Merchant</th><th>Bank</th><th>Card</th><th>Offer</th><th>Status</th><th>Updated</th></tr></thead>
          <tbody id="results"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No matching offers.</div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
